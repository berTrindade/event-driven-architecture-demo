# Event-driven architecture demo: NATS + 4 tiny services. Runs on a laptop.
# `make up` builds and starts everything; `make demo` drives it end to end.

x-app-env: &app-env
  NATS_URL: nats://nats:4222

services:
  nats:
    image: nats:2.10
    # Core NATS only (no -js): ephemeral messaging - see README "Making it production-grade".
    command: ["-m", "8222"]
    ports:
      - "4222:4222" # client connections
      - "8222:8222" # http monitoring (http://localhost:8222)

  order-service:
    build: .
    command: uvicorn services.order_service:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment: *app-env
    depends_on: [nats]

  payment-service:
    build: .
    command: python -m services.payment_service
    environment: *app-env
    depends_on: [nats]

  inventory-service:
    build: .
    command: python -m services.inventory_service
    environment: *app-env
    depends_on: [nats]

  projection-service:
    build: .
    command: uvicorn services.projection_service:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment: *app-env
    depends_on: [nats]
