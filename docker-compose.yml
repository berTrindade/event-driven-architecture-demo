# Event-driven architecture demo: RabbitMQ + 4 tiny services. Runs on a laptop, no cloud.
# `make up` builds and starts everything; `make demo` drives it end to end.

x-app-env: &app-env
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/

x-app-depends: &app-depends
  rabbitmq:
    condition: service_healthy

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI (http://localhost:15672, guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  order-service:
    build: .
    command: uvicorn order_service:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment: *app-env
    depends_on: *app-depends

  payment-service:
    build: .
    command: python payment_service.py
    environment: *app-env
    depends_on: *app-depends

  inventory-service:
    build: .
    command: python inventory_service.py
    environment: *app-env
    depends_on: *app-depends

  projection-service:
    build: .
    command: uvicorn projection_service:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment: *app-env
    depends_on: *app-depends
