# Event-driven architecture demo: Kafka + 4 tiny services. Runs on a laptop, no cloud.
# `make up` builds and starts everything; `make demo` drives it end to end.

x-app-env: &app-env
  KAFKA_BOOTSTRAP: kafka:9092

x-app-depends: &app-depends
  kafka:
    condition: service_healthy

services:
  kafka:
    image: apache/kafka:3.8.1
    # Single-node KRaft (no ZooKeeper): one container is the whole broker.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  order-service:
    build: .
    command: uvicorn order_service:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment: *app-env
    depends_on: *app-depends

  payment-service:
    build: .
    command: python payment_service.py
    environment: *app-env
    depends_on: *app-depends

  inventory-service:
    build: .
    command: python inventory_service.py
    environment: *app-env
    depends_on: *app-depends

  projection-service:
    build: .
    command: uvicorn projection_service:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment: *app-env
    depends_on: *app-depends
