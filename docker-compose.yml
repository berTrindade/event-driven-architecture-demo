# Event-driven architecture demo: RabbitMQ + Postgres + 4 tiny services. Laptop, no cloud.
# `make up` builds and starts everything; `make demo` drives it end to end.

x-app-env: &app-env
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/

x-app-depends: &app-depends
  rabbitmq:
    condition: service_healthy

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI (http://localhost:15672, guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 3s
      timeout: 5s
      retries: 20

  order-service:
    build: .
    command: uvicorn order_service:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment: *app-env
    depends_on: *app-depends

  payment-service:
    build: .
    command: python payment_service.py
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://demo:demo@postgres:5432/demo
    depends_on:
      <<: *app-depends
      postgres:
        condition: service_healthy

  inventory-service:
    build: .
    command: python inventory_service.py
    environment: *app-env
    depends_on: *app-depends

  projection-service:
    build: .
    command: uvicorn projection_service:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://demo:demo@postgres:5432/demo
    depends_on:
      <<: *app-depends
      postgres:
        condition: service_healthy
